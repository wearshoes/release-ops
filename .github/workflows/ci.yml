name: Verify Release Ops

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.0 PyNaCl==1.5.0 PyYAML==6.0.2
      - run: node --test scripts/tests/*.test.mjs
      - run: python -m unittest discover -s scripts/tests -p "test_*.py"
      - run: python scripts/validate_self.py
